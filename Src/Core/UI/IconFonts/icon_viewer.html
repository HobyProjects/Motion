        :root {
            /* Neumorphic Color Palette */
            --neu-bg: #e0e5ec;
            --neu-light: #ffffff;
            --neu-dark: #a3b1c6;
            --neu-shadow-light: rgba(255, 255, 255, 0.8);
            --neu-shadow-dark: rgba(163, 177, 198, 0.6);
            
            /* Accent Colors */
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-success: #48bb78;
            --accent-warning: #ed8936;
            --accent-danger: #f56565;
            
            /* Text Colors */
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --text-muted: #a0aec0;
            
            /* Component Specific */
            --card-shadow-sm: 4px 4px 8px var(--neu-shadow-dark), -4px -4px 8px var(--neu-shadow-light);
            --card-shadow-lg: 8px 8px 16px var(--neu-shadow-dark), -8px -8px 16px var(--neu-shadow-light);
            --card-shadow-inset: inset 2px 2px 4px var(--neu-shadow-dark), inset -2px -2px 4px var(--neu-shadow-light);
            --card-shadow-pressed: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--neu-bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header Styles */
        .header {
            background: var(--neu-bg);
            padding: 2rem 1rem 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(163, 177, 198, 0.2);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
            background: var(--neu-bg);
            border-radius: 20px;
            box-shadow: var(--card-shadow-lg);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 500;
        }

        /* Container */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Control Panel */
        .controls {
            background: var(--neu-bg);
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 20px;
            box-shadow: var(--card-shadow-lg);
        }

        /* Search Bar - Neumorphic */
        .search-container {
            margin-bottom: 1.5rem;
        }

        .search-bar {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1.2rem 1.2rem 1.2rem 3.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            outline: none;
            background: var(--neu-bg);
            color: var(--text-primary);
            box-shadow: var(--card-shadow-inset);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-primary);
            pointer-events: none;
        }

        /* Filter Groups */
        .filter-section {
            margin-bottom: 1.5rem;
        }

        .filter-label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Neumorphic Buttons */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            background: var(--neu-bg);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            color: var(--text-primary);
            box-shadow: var(--card-shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-lg);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: var(--card-shadow-pressed);
        }

        .btn.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn.active:hover {
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }

        /* Category Pills */
        .category-pill {
            padding: 0.5rem 1rem;
            background: var(--neu-bg);
            border-radius: 20px;
            font-size: 0.85rem;
            box-shadow: var(--card-shadow-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .category-pill:hover {
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-lg);
        }

        .category-pill.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* Sort Dropdown - Neumorphic */
        .sort-container {
            position: relative;
            display: inline-block;
            min-width: 200px;
        }

        .sort-select {
            width: 100%;
            padding: 0.75rem 2.5rem 0.75rem 1rem;
            border: none;
            border-radius: 12px;
            background: var(--neu-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            appearance: none;
            box-shadow: var(--card-shadow-inset);
            transition: all 0.3s ease;
        }

        .sort-select:focus {
            outline: none;
            box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
        }

        .sort-arrow {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--accent-primary);
        }

        /* Size Controls */
        .size-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--neu-bg);
            border-radius: 12px;
            box-shadow: var(--card-shadow-inset);
        }

        .size-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 10px;
            background: var(--neu-bg);
            box-shadow: var(--card-shadow-inset);
            outline: none;
        }

        .size-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
            transition: all 0.2s ease;
        }

// Utility: Convert UTF-8 string to character
function utf8ToString(utf8Str) {
    const bytes = [];
    let i = 0;
    while (i < utf8Str.length) {
        if (utf8Str[i] === '\\' && utf8Str[i+1] === 'x') {
            bytes.push(parseInt(utf8Str.substr(i+2, 2), 16));
            i += 4;
        } else {
            bytes.push(utf8Str.charCodeAt(i));
            i++;
        }
    }
    return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
}

// Categorize icon based on name
function categorizeIcon(name, iconSet) {
    const categories = iconCategories[iconSet];
    const lowerName = name.toLowerCase();
    
    for (const [category, keywords] of Object.entries(categories)) {
        if (category === 'Other') continue;
        
        for (const keyword of keywords) {
            if (lowerName.includes(keyword)) {
                return category;
            }
        }
    }
    
    return 'Other';
}

// Initialize icons with categories
function initIcons() {
    allIcons = [];
    
    // Process Font Awesome icons
    fontAwesomeIcons.forEach(icon => {
        const category = categorizeIcon(icon.name, 'fa');
        allIcons.push({
            name: icon.name,
            displayName: icon.name.replace(/_/g, ' ').toLowerCase(),
            character: utf8ToString(icon.utf8),
            unicode: icon.unicode,
            utf8: icon.utf8,
            set: 'fa',
            setName: 'Font Awesome',
            define: `ICON_FA_${icon.name}`,
            category: category
        });
    });
    
    // Process Material Design icons
    materialDesignIcons.forEach(icon => {
        const category = categorizeIcon(icon.name, 'md');
        allIcons.push({
            name: icon.name,
            displayName: icon.name.replace(/_/g, ' ').toLowerCase(),
            character: utf8ToString(icon.utf8),
            unicode: icon.unicode,
            utf8: icon.utf8,
            set: 'md',
            setName: 'Material Design',
            define: `ICON_MD_${icon.name}`,
            category: category
        });
    });
    
    updateStats();
    renderCategoryFilters();
    renderIcons();
}

// Update statistics
function updateStats() {
    const faCount = fontAwesomeIcons.length;
    const mdCount = materialDesignIcons.length;
    
    // Get unique categories
    const categories = new Set();
    allIcons.forEach(icon => categories.add(icon.category));
    
    document.getElementById('totalIcons').textContent = (faCount + mdCount).toLocaleString();
    document.getElementById('faCount').textContent = faCount.toLocaleString();
    document.getElementById('mdCount').textContent = mdCount.toLocaleString();
    document.getElementById('categoryCount').textContent = categories.size;
}

// Render category filter buttons
function renderCategoryFilters() {
    const categories = new Set();
    allIcons.forEach(icon => {
        if (currentFilter === 'all' || icon.set === currentFilter) {
            categories.add(icon.category);
        }
    });
    
    const sortedCategories = Array.from(categories).sort();
    const container = document.getElementById('categoryFilter');
    
    // Keep "All Categories" button
    const allButton = container.querySelector('[data-category="all"]');
    container.innerHTML = '';
    container.appendChild(allButton);
    
    // Add category buttons
    sortedCategories.forEach(category => {
        const btn = document.createElement('button');
        btn.className = 'category-pill';
        btn.setAttribute('data-category', category);
        btn.textContent = category;
        btn.onclick = () => selectCategory(category);
        container.appendChild(btn);
    });
}

// Filter and sort icons
function getFilteredIcons() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    let filtered = allIcons;
    
    // Filter by icon set
    if (currentFilter === 'fa') {
        filtered = filtered.filter(icon => icon.set === 'fa');
    } else if (currentFilter === 'md') {
        filtered = filtered.filter(icon => icon.set === 'md');
    }
    
    // Filter by category
    if (currentCategory !== 'all') {
        filtered = filtered.filter(icon => icon.category === currentCategory);
    }
    
    // Filter by search term
    if (searchTerm) {
        filtered = filtered.filter(icon => 
            icon.displayName.includes(searchTerm) ||
            icon.name.toLowerCase().includes(searchTerm) ||
            icon.category.toLowerCase().includes(searchTerm)
        );
    }
    
    // Sort
    filtered = sortIcons(filtered);
    
    return filtered;
}

// Sort icons
function sortIcons(icons) {
    const sorted = [...icons];
    
    switch (currentSort) {
        case 'name-asc':
            sorted.sort((a, b) => a.displayName.localeCompare(b.displayName));
            break;
        case 'name-desc':
            sorted.sort((a, b) => b.displayName.localeCompare(a.displayName));
            break;
        case 'unicode-asc':
            sorted.sort((a, b) => parseInt(a.unicode, 16) - parseInt(b.unicode, 16));
            break;
        case 'unicode-desc':
            sorted.sort((a, b) => parseInt(b.unicode, 16) - parseInt(a.unicode, 16));
            break;
    }
    
    return sorted;
}

            <div class="category-section">
                <div class="category-header" onclick="toggleCategory(this)">
                    <span class="category-icon">${categoryEmoji}</span>
                    <h2 class="category-title">${category}</h2>
                    <span class="category-count">${icons.length}</span>
                    <span class="category-toggle">▼</span>
                </div>
                <div class="icons-grid">
                    ${icons.map(icon => `
                        <div class="icon-card" onclick='showIconModal(${JSON.stringify(icon).replace(/'/g, "\'")})''>
                            <div class="icon-display ${icon.set}" style="font-size: ${currentIconSize}px;">${icon.character}</div>
                            <div class="icon-name">${icon.displayName}</div>
                            <div class="icon-unicode">U+${icon.unicode.toUpperCase()}</div>
                            <div class="icon-set-badge ${icon.set}">${icon.setName}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

// Toggle category collapse
function toggleCategory(header) {
    header.classList.toggle('collapsed');
    const grid = header.nextElementSibling;
    grid.style.display = header.classList.contains('collapsed') ? 'none' : 'grid';
}

// Select icon set filter
function selectFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('[data-filter]').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
    renderCategoryFilters();
    renderIcons();
}

// Select category filter
function selectCategory(category) {
    currentCategory = category;
    document.querySelectorAll('[data-category]').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`[data-category="${category}"]`).classList.add('active');
    renderIcons();
}

// Show icon details modal
function showIconModal(icon) {
    currentIcon = icon;
    
    document.getElementById('modalIcon').className = `modal-icon ${icon.set}`;
    document.getElementById('modalIcon').textContent = icon.character;
    document.getElementById('modalTitle').textContent = icon.displayName;
    document.getElementById('modalSet').textContent = icon.setName;
    document.getElementById('modalCategory').textContent = icon.category;
    document.getElementById('modalDefine').textContent = icon.define;
    document.getElementById('modalUnicode').textContent = `U+${icon.unicode.toUpperCase()}`;
    document.getElementById('modalUtf8').textContent = icon.utf8;
    
    document.getElementById('iconModal').classList.add('active');
}

// Close modal
function closeModal() {
    document.getElementById('iconModal').classList.remove('active');
}

// Copy functions
function copyIcon() {
    if (!currentIcon) return;
    navigator.clipboard.writeText(currentIcon.character).then(() => {
        showToast('✓ Icon character copied!', 'success');
        flashButton('copyIconBtn');
    });
}

function copyUnicode() {
    if (!currentIcon) return;
    navigator.clipboard.writeText(`U+${currentIcon.unicode.toUpperCase()}`).then(() => {
        showToast('✓ Unicode value copied!', 'success');
        flashButton('copyUnicodeBtn');
    });
}

function copyDefine() {
    if (!currentIcon) return;
    navigator.clipboard.writeText(currentIcon.define).then(() => {
        showToast('✓ C++ define name copied!', 'success');
        flashButton('copyDefineBtn');
    });
}

function flashButton(btnId) {
    const btn = document.getElementById(btnId);
    btn.classList.add('success');
    setTimeout(() => btn.classList.remove('success'), 1000);
}

function showToast(message, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast ${type}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

// Event listeners
document.getElementById('searchInput').addEventListener('input', renderIcons);

document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.addEventListener('click', (e) => {
        selectFilter(e.target.dataset.filter);
    });
});

document.getElementById('sortSelect').addEventListener('change', (e) => {
    currentSort = e.target.value;
    renderIcons();
});

document.getElementById('sizeSlider').addEventListener('input', (e) => {
    currentIconSize = parseInt(e.target.value);
    document.getElementById('sizeValue').textContent = currentIconSize + 'px';
    document.querySelectorAll('.icon-display').forEach(icon => {
        icon.style.fontSize = currentIconSize + 'px';
    });
});

document.getElementById('iconModal').addEventListener('click', (e) => {
    if (e.target.id === 'iconModal') closeModal();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

// Initialize
initIcons();
    </script>
</body>
</html>
